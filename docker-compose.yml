services:
  postgres:
    image: postgres:16-alpine
    container_name: mssons_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ms_sons_tours
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mssons_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: mssons_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: mssons_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "127.0.0.1:2181:2181"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mssons_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # JWT_SECRET, FRONTEND_URL and SITE_URL are interpolated from the
      # project root .env file (create it from .env.example). JWT_SECRET is
      # REQUIRED, so `docker compose config` fails fast here instead of
      # silently falling back to an insecure placeholder that would only
      # crash-loop the backend at runtime.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ms_sons_tours?schema=public
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - create a .env file at the project root from .env.example and set JWT_SECRET, e.g. generated with: openssl rand -base64 48}"
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SITE_URL: ${SITE_URL:-https://www.mssons.com}
      WHATSAPP_NUMBER: "923713011519"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      NODE_ENV: production
      UPLOADS_PATH: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mssons_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    volumes:
      - uploads_data:/usr/share/nginx/html/uploads

volumes:
  postgres_data:
  redis_data:
  uploads_data:
